<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>如何培养孩子的社会能力 · 听读</title>
<style>
  :root{--bg:#1b1714;--card:#27211c;--card2:#2f2822;--acc:#e0a86b;--acc2:#c98a4b;--txt:#f3ece3;--sub:#b6a99a;--line:#3a322b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(160deg,#1b1714,#221b16);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding-bottom:96px}
  header{padding:38px 22px 26px;text-align:center;max-width:760px;margin:0 auto}
  .badge{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--acc);border:1px solid var(--acc2);border-radius:20px;padding:4px 14px;margin-bottom:16px}
  h1{font-size:26px;font-weight:700;line-height:1.4;margin-bottom:10px}
  .author{color:var(--sub);font-size:14px;margin-bottom:18px}
  .meta{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
  .meta b{color:var(--acc);font-weight:600}
  .intro{max-width:620px;margin:14px auto 0;font-size:13.5px;line-height:1.8;color:var(--sub);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  main{max-width:760px;margin:30px auto;padding:0 18px}
  .sec-t{font-size:14px;color:var(--sub);margin:0 4px 14px;letter-spacing:1px}
  ul{list-style:none}
  li.track{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.18s}
  li.track:hover{background:var(--card2);border-color:var(--acc2);transform:translateY(-1px)}
  li.track.playing{background:linear-gradient(100deg,#33281d,#3a2c1c);border-color:var(--acc)}
  .idx{flex:0 0 38px;height:38px;border-radius:50%;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  li.track.playing .idx{background:var(--acc);color:#231c15}
  .tt{flex:1;min-width:0}
  .tt .t1{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt .t2{font-size:12px;color:var(--sub);margin-top:3px}
  .dur{flex:0 0 auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .eq{display:none;gap:3px;align-items:flex-end;height:16px;margin-left:6px}
  li.track.playing .eq{display:flex}
  .eq i{width:3px;background:var(--acc);border-radius:2px;animation:eq .9s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(28,23,19,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-width:760px;margin:0 auto;box-sizing:border-box}
  #btn{flex:0 0 52px;height:52px;border-radius:50%;border:none;background:var(--acc);color:#231c15;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #btn:active{transform:scale(.94)}
  .pinfo{flex:1;min-width:0;text-align:left}
  .pname{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptime{font-size:11.5px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
  .bar{width:100%;height:6px;background:var(--line);border-radius:3px;cursor:pointer;position:relative;order:-1}
  .bar::after{content:"";position:absolute;left:0;right:0;top:-11px;bottom:-11px}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);border-radius:3px}
  .pwrap{display:flex;align-items:center;gap:10px;width:100%}
  .navb{flex:0 0 auto;background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:8px 6px;min-width:40px;min-height:40px}
  .navb:active{color:var(--acc)}
  audio{display:none}
  @media (max-width:600px){footer{padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:6px}.pname{font-size:14px}.bar{height:7px}.navb{min-width:38px;min-height:38px;padding:6px 4px}#btn{flex:0 0 48px;height:48px}}
</style>
</head>
<body>
<header>
  <span class="badge">AI 语音听读 · 子言播讲</span>
  <h1>如何培养孩子的社会能力</h1>
  <div class="author">[美] 默娜·B.舒尔 / 特里萨·弗伊·迪吉若尼莫 著 · 张雪兰 译</div>
  <div class="meta">
    <span>共 <b id="m1">10</b> 讲</span>
    <span>总时长 <b id="m2">--</b></span>
    <span>方法 <b>ICPS 我能解决问题</b></span>
  </div>
  <div class="intro">这是一本教父母"如何思考，而不是思考什么"的育儿书。作者基于数十年研究，提出 <b>ICPS（我能解决问题）</b> 对话法：不替孩子做决定，而是用一套字词游戏和提问，帮孩子自己想出解决办法、理解他人感受、预判后果。本听读按章节拆解全书，陪你边听边练。</div>
</header>
<main>
  <div class="sec-t">章节列表（点击播放）</div>
  <ul id="list"></ul>
</main>
<footer>
  <div class="pwrap">
    <button class="navb" id="prev" title="上一章">⏮</button>
    <button id="btn" title="播放/暂停">▶</button>
    <button class="navb" id="next" title="下一章">⏭</button>
    <div class="pinfo">
      <div class="pname" id="pname">未播放</div>
      <div class="ptime"><span id="cur">00:00</span> / <span id="tot">00:00</span></div>
    </div>
  </div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <audio id="audio" preload="metadata"></audio>
</footer>
<script>
const BOOK = {
  title: "如何培养孩子的社会能力",
  tracks: [
    {title:"引言", file:"audio/raise_thinking_child/00_引言.mp3", duration:874},
    {title:"第1章 如何思考，而不是思考什么", file:"audio/raise_thinking_child/01_第1章_如何思考而不是思考什么.mp3", duration:692},
    {title:"第2章 字词游戏", file:"audio/raise_thinking_child/02_第2章_字词游戏.mp3", duration:997},
    {title:"第3章 理解他人的感受", file:"audio/raise_thinking_child/03_第3章_理解他人的感受.mp3", duration:1386},
    {title:"第4章 更多的字词练习", file:"audio/raise_thinking_child/04_第4章_更多的字词练习.mp3", duration:962},
    {title:"第5章 寻找多种解决办法", file:"audio/raise_thinking_child/05_第5章_寻找多种解决办法.mp3", duration:1479},
    {title:"第6章 考虑后果", file:"audio/raise_thinking_child/06_第6章_考虑后果.mp3", duration:1163},
    {title:"第7章 游戏和活动", file:"audio/raise_thinking_child/07_第7章_游戏和活动.mp3", duration:934},
    {title:"第8章 综合运用", file:"audio/raise_thinking_child/08_第8章_综合运用.mp3", duration:1269},
    {title:"附录 自我评价与实用工具", file:"audio/raise_thinking_child/09_附录_自我评价与实用工具.mp3", duration:724}
  ]
};
const audio=document.getElementById('audio');
const list=document.getElementById('list');
const btn=document.getElementById('btn');
const pname=document.getElementById('pname');
const cur=document.getElementById('cur');
const tot=document.getElementById('tot');
const fill=document.getElementById('fill');
const bar=document.getElementById('bar');
let curIdx=-1;
const fmt=s=>{s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;};
// 总时长
let total=BOOK.tracks.reduce((a,t)=>a+t.duration,0);
document.getElementById('m2').textContent=fmt(total);
// 渲染
BOOK.tracks.forEach((t,i)=>{
  const li=document.createElement('li');
  li.className='track';li.dataset.i=i;
  li.innerHTML=`<div class="idx">${i+1}</div>
    <div class="tt"><div class="t1">${t.title}</div><div class="t2">子言 · 播讲</div></div>
    <div class="eq"><i></i><i></i><i></i></div>
    <div class="dur">${fmt(t.duration)}</div>`;
  li.onclick=()=>play(i);
  list.appendChild(li);
});
const items=[...document.querySelectorAll('.track')];
function play(i){
  if(i<0||i>=BOOK.tracks.length)return;
  const t=BOOK.tracks[i];
  if(i!==curIdx){curIdx=i;audio.src=t.file;}
  audio.play().catch(()=>{});
}
function setPlaying(i,on){
  items.forEach((el,k)=>el.classList.toggle('playing',k===i&&on));
  if(on){pname.textContent=BOOK.tracks[i].title;items[i].scrollIntoView({block:'nearest',behavior:'smooth'});}
}
btn.onclick=()=>{if(curIdx<0)play(0);else audio.paused?audio.play():audio.pause();};
document.getElementById('prev').onclick=()=>curIdx>0&&play(curIdx-1);
document.getElementById('next').onclick=()=>curIdx<BOOK.tracks.length-1&&play(curIdx+1);
audio.onplay=()=>{setPlaying(curIdx,true);btn.textContent='⏸';};
audio.onpause=()=>{setPlaying(curIdx,false);btn.textContent='▶';};
audio.onended=()=>{if(curIdx<BOOK.tracks.length-1)play(curIdx+1);else{setPlaying(curIdx,false);btn.textContent='▶';}};
audio.onloadedmetadata=()=>{
  // 动态校准真实时长，根除显示旧时长问题
  const d=isFinite(audio.duration)&&audio.duration>0?audio.duration:BOOK.tracks[curIdx].duration;
  tot.textContent=fmt(d);
};
audio.ontimeupdate=()=>{
  if(audio.duration){fill.style.width=(audio.currentTime/audio.duration*100)+'%';cur.textContent=fmt(audio.currentTime);}
};
bar.onclick=e=>{if(audio.duration){const r=bar.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;}};
let seeking=false;
const seekTo=x=>{if(!audio.duration)return;const r=bar.getBoundingClientRect();const p=Math.min(Math.max((x-r.left)/r.width,0),1);audio.currentTime=p*audio.duration;};
bar.addEventListener('touchstart',e=>{if(!audio.duration)return;seeking=true;seekTo(e.touches[0].clientX);e.preventDefault();},{passive:false});
bar.addEventListener('touchmove',e=>{if(seeking){seekTo(e.touches[0].clientX);e.preventDefault();}},{passive:false});
bar.addEventListener('touchend',()=>{seeking=false;});
</script>
</body>
</html>
